<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constraint-First Topology</title>

<style>
:root{
  --green:#7cffc4;
  --bright:#00ff88;
}

html,body{
  margin:0;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:monospace;
  color:var(--green);
  cursor:pointer;
}

body{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* full-screen CRT scanlines */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.04) 0px,
      rgba(255,255,255,0.04) 1px,
      transparent 2px,
      transparent 4px
    );
  opacity:0.13;
  z-index:20;
}

/* applied briefly by JavaScript */
body.glitch{
  animation:pageJitter 0.28s linear;
  filter:brightness(1.35) contrast(1.22);
}

@keyframes pageJitter{
  0%   { transform:translate(0,0) skewX(0deg); }
  15%  { transform:translate(-7px,-5px) skewX(-1deg); }
  30%  { transform:translate(6px,4px) skewX(1deg); }
  45%  { transform:translate(-4px,7px) skewX(-0.6deg); }
  60%  { transform:translate(8px,-3px) skewX(0.8deg); }
  75%  { transform:translate(-5px,3px) skewX(-0.5deg); }
  100% { transform:translate(0,0) skewX(0deg); }
}

/* glitch bands */
.glitch-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:0;
  z-index:30;
  mix-blend-mode:screen;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 14px,
      rgba(0,255,120,0.16) 15px,
      transparent 17px
    );
}

.glitch-layer.active{
  animation:glitchFlash 0.28s linear;
}

@keyframes glitchFlash{
  0%   { opacity:0; transform:translateY(0); }
  20%  { opacity:0.6; transform:translateY(-12px); }
  40%  { opacity:0.28; transform:translateY(8px); }
  60%  { opacity:0.5; transform:translateY(-5px); }
  100% { opacity:0; transform:translateY(0); }
}

.title{
  font-size:14px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--bright);
  text-shadow:0 0 10px #00ff66;
  margin-bottom:10px;
  white-space:nowrap;
}

/* portal */
canvas{
  width:min(470px,88vw);
  height:min(470px,88vw);
  border-radius:50%;
  background:
    radial-gradient(circle at center, #101410 0%, #000 100%);
  border:2px solid rgba(0,255,120,0.34);
  box-shadow:
    0 0 35px rgba(0,255,120,0.16),
    inset 0 0 90px rgba(0,255,120,0.07);
}

/* subtitles */
.subs{
  position:fixed;
  bottom:38px;
  width:min(580px,92vw);
  min-height:2em;
  padding:6px 10px;
  text-align:center;
  line-height:1.45;
  font-size:14px;
  color:#d8ffe8;
  text-shadow:0 0 6px #00ff66;
  background:rgba(0,20,0,0.28);
  border:1px solid rgba(0,255,120,0.14);
  border-radius:6px;
  pointer-events:none;
  z-index:10;
}

/* essay link */
.link{
  position:fixed;
  bottom:8px;
  width:min(580px,92vw);
  text-align:center;
  font-size:12px;
  color:#7cffc4;
  opacity:0.72;
  text-decoration:none;
  z-index:11;
}

.link:hover{
  opacity:1;
}
</style>
</head>

<body>

<div class="glitch-layer" id="glitchLayer"></div>

<div class="title">Constraint-First Topology</div>

<canvas id="viz"></canvas>

<div class="subs" id="subs"></div>

<a class="link"
   href="https://standardgalactic.github.io/research-projects/working/constraint-first-topology.pdf"
   target="_blank">
  Constraint-First Topology
</a>

<audio id="audio" preload="auto">
  <source src="Physical_objects_are_mathematical_constraints.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
const subs = document.getElementById("subs");
const canvas = document.getElementById("viz");
const g = canvas.getContext("2d");
const glitchLayer = document.getElementById("glitchLayer");

document.querySelector(".link").onclick = e => e.stopPropagation();

/* AUDIO */
let ctxAudio;
let analyser;
let data;

function initAudio(){
  if(ctxAudio) return;

  ctxAudio = new (window.AudioContext || window.webkitAudioContext)();

  analyser = ctxAudio.createAnalyser();
  analyser.fftSize = 2048;

  data = new Uint8Array(analyser.fftSize);

  const src = ctxAudio.createMediaElementSource(audio);
  src.connect(analyser);
  analyser.connect(ctxAudio.destination);
}

document.body.onclick = async ()=>{
  initAudio();

  if(ctxAudio.state === "suspended"){
    await ctxAudio.resume();
  }

  if(audio.paused){
    await audio.play();
  }else{
    audio.pause();
  }
};

/* SUBTITLES */
let cues = [];

async function loadVTT(file){
  cues = [];

  try{
    const r = await fetch(file);

    if(!r.ok){
      throw new Error("HTTP " + r.status + " " + file);
    }

    const txt = await r.text();
    const blocks = txt.split(/\n{2,}/);

    for(const block of blocks){
      const lines = block.trim().split("\n");
      const ts = lines.find(l => l.includes("-->"));

      if(!ts) continue;

      const [s,e] = ts.split("-->").map(x => x.trim());

      const cueText = lines
        .slice(lines.indexOf(ts)+1)
        .join(" ")
        .trim();

      cues.push({
        start:parseTime(s),
        end:parseTime(e),
        text:cueText
      });
    }

    console.log("Loaded VTT cues:", cues.length, file);

  }catch(err){
    console.warn("VTT failed:", err);
  }
}

function parseTime(t){
  const p = t.replace(",",".").split(":");

  return p.length === 3
    ? +p[0]*3600 + +p[1]*60 + +p[2]
    : +p[0]*60 + +p[1];
}

audio.ontimeupdate = ()=>{
  const t = audio.currentTime;

  const cue = cues.find(c =>
    t >= c.start &&
    t < c.end + 0.2
  );

  subs.textContent = cue ? cue.text : "";
};

loadVTT("Physical_objects_are_mathematical_constraints.vtt");

/* CANVAS */
const DPR = window.devicePixelRatio || 1;

canvas.width = 380 * DPR;
canvas.height = 380 * DPR;

g.scale(DPR,DPR);

let tick = 0;
let nextGlitch = performance.now() + 18000 + Math.random()*22000;

function smoothNoise(x){
  return (
    Math.sin(x)*0.5 +
    Math.sin(x*0.73)*0.28 +
    Math.sin(x*1.37)*0.14
  );
}

function triggerGlitch(){
  document.body.classList.add("glitch");
  glitchLayer.classList.add("active");

  setTimeout(()=>{
    document.body.classList.remove("glitch");
    glitchLayer.classList.remove("active");
  },280);
}

function maybeGlitch(now, energy){
  if(now > nextGlitch){
    triggerGlitch();

    /* roughly every 35–70 seconds, slightly more often during high energy */
    const base = 35000 + Math.random()*35000;
    const energyBias = Math.max(0, 12000 * energy);

    nextGlitch = now + Math.max(18000, base - energyBias);
  }
}

function draw(now){
  tick++;

  g.fillStyle = "rgba(0,6,0,0.07)";
  g.fillRect(0,0,380,380);

  const cx = 190;
  const cy = 190;
  const R = 152;

  let energy = 0;

  if(analyser){
    analyser.getByteTimeDomainData(data);

    for(let i=0;i<data.length;i+=8){
      energy += Math.abs((data[i]-128)/128);
    }

    energy /= (data.length/8);
  }

  maybeGlitch(now || performance.now(), energy);

  g.save();

  g.beginPath();
  g.arc(cx,cy,R,0,Math.PI*2);
  g.clip();

  /* constraint grid */
  const gridShift = Math.sin(tick*0.0014)*14;

  g.strokeStyle = "rgba(0,255,120,0.045)";
  g.lineWidth = 1;

  for(let x=-380; x<760; x+=24){
    g.beginPath();
    g.moveTo(x+gridShift,-380);
    g.lineTo(x+gridShift,760);
    g.stroke();
  }

  for(let y=-380; y<760; y+=24){
    g.beginPath();
    g.moveTo(-380,y-gridShift);
    g.lineTo(760,y-gridShift);
    g.stroke();
  }

  /* constraint shells */
  for(let i=1;i<=8;i++){
    g.beginPath();
    g.arc(cx,cy,(R/8)*i,0,Math.PI*2);
    g.strokeStyle = `rgba(120,255,180,${0.01+i*0.007})`;
    g.lineWidth = 1;
    g.stroke();
  }

  if(analyser){
    const lag = Math.floor(
      data.length * (0.10 + smoothNoise(tick*0.006)*0.045)
    );

    const driftX = Math.sin(tick*0.0011)*6;
    const driftY = Math.cos(tick*0.0009)*5;

    /* ghost layer */
    g.beginPath();

    for(let i=0;i<data.length;i++){
      const a = (data[i]-128)/128;
      const b = (data[(i+lag)%data.length]-128)/128;

      const theta = (i/data.length)*Math.PI*2;
      const snap =
        1 +
        Math.sin(theta*4 + tick*0.004)*0.018;

      const x = cx + driftX + a*R*snap*0.9;
      const y = cy + driftY + b*R*snap*0.82;

      if(i===0) g.moveTo(x,y);
      else g.lineTo(x,y);
    }

    g.strokeStyle = `rgba(120,255,180,${0.12+energy*0.2})`;
    g.lineWidth = 5;
    g.stroke();

    /* bright trace */
    g.beginPath();

    for(let i=0;i<data.length;i++){
      const a = (data[i]-128)/128;
      const b = (data[(i+lag)%data.length]-128)/128;

      const theta = (i/data.length)*Math.PI*2;
      const snap =
        1 +
        Math.sin(theta*4 + tick*0.004)*0.018;

      const x = cx + driftX + a*R*snap*0.9;
      const y = cy + driftY + b*R*snap*0.82;

      if(i===0) g.moveTo(x,y);
      else g.lineTo(x,y);
    }

    g.strokeStyle = "#7cffc4";
    g.lineWidth = 1.45 + energy*1.7;
    g.shadowBlur = 10 + energy*18;
    g.shadowColor = "#00ff88";
    g.stroke();
    g.shadowBlur = 0;
  }

  /* portal boundary */
  g.beginPath();
  g.arc(cx,cy,R,0,Math.PI*2);
  g.strokeStyle = "rgba(120,255,180,0.26)";
  g.lineWidth = 2;
  g.stroke();

  g.restore();

  requestAnimationFrame(draw);
}

draw(performance.now());
</script>

</body>
</html>
